<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Pet — Agendamento de Atendimentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="4" r="2" />
            <circle cx="18" cy="8" r="2" />
            <circle cx="20" cy="16" r="2" />
            <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
          </svg>
        </span>
        <span class="brand-name">MUNDO PET</span>
      </div>
    </header>

    <main class="main-content">
      <div class="agenda-header">
        <div class="agenda-title-group">
          <h1>Sua agenda</h1>
          <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
        </div>

        <div class="date-picker-wrapper">
          <label for="filter-date" class="sr-only">Selecionar data da agenda</label>
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </span>
          <input type="date" id="filter-date" aria-label="Data da agenda" />
        </div>
      </div>

      <section class="periods-wrapper" id="agenda-sections" aria-label="Agendamentos por período">
        <article class="period-card" data-period="morning">
          <header class="period-header">
            <div class="period-title">
              <span class="period-icon morning-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v4" />
                  <path d="m4.93 4.93 2.83 2.83" />
                  <path d="M20 12h2" />
                  <path d="m19.07 4.93-2.83 2.83" />
                  <path d="M2 12h2" />
                  <path d="M16 12a4 4 0 0 0-8 0" />
                  <line x1="2" y1="16" x2="22" y2="16" />
                  <line x1="5" y1="20" x2="19" y2="20" />
                </svg>
              </span>
              <h2>Manhã</h2>
            </div>
            <span class="period-range">09h-12h</span>
          </header>
          <ul class="appointments-list" id="list-morning"></ul>
        </article>

        <article class="period-card" data-period="afternoon">
          <header class="period-header">
            <div class="period-title">
              <span class="period-icon afternoon-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2" />
                  <path d="M12 20v2" />
                  <path d="m4.93 4.93 1.41 1.41" />
                  <path d="m17.66 17.66 1.41 1.41" />
                  <path d="M2 12h2" />
                  <path d="M20 12h2" />
                  <path d="m6.34 17.66-1.41 1.41" />
                  <path d="m19.07 4.93-1.41 1.41" />
                </svg>
              </span>
              <h2>Tarde</h2>
            </div>
            <span class="period-range">13h-18h</span>
          </header>
          <ul class="appointments-list" id="list-afternoon"></ul>
        </article>

        <article class="period-card" data-period="night">
          <header class="period-header">
            <div class="period-title">
              <span class="period-icon night-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                  <path d="M19 3v4" />
                  <path d="M21 5h-4" />
                </svg>
              </span>
              <h2>Noite</h2>
            </div>
            <span class="period-range">19h-21h</span>
          </header>
          <ul class="appointments-list" id="list-night"></ul>
        </article>
      </section>
    </main>

    <div class="floating-action">
      <button type="button" class="btn-primary" id="open-modal-btn">
        NOVO AGENDAMENTO
      </button>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-describedby="modal-subtitle"
    >
      <button type="button" class="modal-close-btn" id="close-modal-btn" aria-label="Fechar modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <div class="modal-header">
        <h2 id="modal-title">Agende um atendimento</h2>
        <p id="modal-subtitle">Preencha os dados do cliente para realizar o agendamento:</p>
      </div>

      <form id="appointment-form" novalidate>
        <div class="form-group">
          <label for="tutor-name">Nome do tutor</label>
          <div class="input-field">
            <span class="field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="tutor-name" name="tutorName" placeholder="Helena Souza" required />
          </div>
          <span class="error-message" id="error-tutorName" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="pet-name">Nome do pet</label>
          <div class="input-field">
            <span class="field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="4" r="2" />
                <circle cx="18" cy="8" r="2" />
                <circle cx="20" cy="16" r="2" />
                <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
              </svg>
            </span>
            <input type="text" id="pet-name" name="petName" placeholder="Cheddar" required />
          </div>
          <span class="error-message" id="error-petName" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="tutor-phone">Telefone</label>
          <div class="input-field">
            <span class="field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
              </svg>
            </span>
            <input type="tel" id="tutor-phone" name="phone" placeholder="(00) 00000-0000" maxlength="15" required />
          </div>
          <span class="error-message" id="error-phone" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="service-description">Descrição do serviço</label>
          <div class="input-field textarea-field">
            <textarea id="service-description" name="service" rows="3" placeholder="Banho e tosa" required></textarea>
          </div>
          <span class="error-message" id="error-service" aria-live="polite"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="appointment-date">Data</label>
            <div class="input-field">
              <span class="field-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
              </span>
              <input type="date" id="appointment-date" name="date" required />
            </div>
            <span class="error-message" id="error-date" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="appointment-time">Hora</label>
            <div class="input-field">
              <span class="field-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <polyline points="12 6 12 12 16 14" />
                </svg>
              </span>
              <input type="time" id="appointment-time" name="time" required />
            </div>
            <span class="error-message" id="error-time" aria-live="polite"></span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary btn-submit">AGENDAR</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
